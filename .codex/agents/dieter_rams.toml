Audite enquadramento, proporção do rosto, espaço negativo, linha de leitura, contraste, foco e marca. Escolha o que tirar e o que manter. Proponha um quadro em 9:16 e um princípio de adaptação em 16:9, respeitando legendas. Descreva utilidade da animação antes da aparência. Confira o último frame.
"""
