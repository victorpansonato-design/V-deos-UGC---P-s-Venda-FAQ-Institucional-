<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Rematrícula · Estudo de composição</title>
  <style>
    @font-face {
      font-family: Inter;
      src: url("assets/fonts/inter.woff2") format("woff2");
      font-weight: 100 900;
    }

    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, sans-serif; }
    #editorial {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      position: relative;
      color: #f7fafd;
      background: radial-gradient(ellipse at 60% 18%, #104675 0%, #0b2946 37%, #071729 76%);
    }

    .window {
      position: absolute;
      top: 190px;
      left: 100px;
      width: 880px;
      height: 600px;
      z-index: 1;
      overflow: hidden;
      border-radius: 58px;
      background: #102f50;
      border: 1px solid #b1d9fc60;
      box-shadow: 0 30px 100px #031122b8;
      transform-origin: center center;
    }

    #campus {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 44%;
    }

    .photo-shade {
      position: absolute;
      z-index: 2;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, #14334f04 45%, #132c3f18 70%, #061b304f 100%);
    }

    .copy {
      position: absolute;
      z-index: 3;
      top: 860px;
      left: 132px;
      right: 202px;
    }

    .topic {
      display: block;
      margin-bottom: 22px;
      color: #aad9fc;
      font-size: 33px;
      font-weight: 600;
      letter-spacing: .075em;
      text-transform: uppercase;
    }

    .headline {
      min-height: 162px;
      margin: 0;
      font-size: 64px;
      line-height: .99;
      letter-spacing: -3px;
      font-weight: 720;
    }

    .headline strong { display: block; font-weight: inherit; color: #acdcff; }

    .steps {
      position: absolute;
      z-index: 3;
      top: 1122px;
      left: 132px;
      right: 202px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .step {
      position: relative;
      isolation: isolate;
      border-radius: 26px;
      overflow: hidden;
      background: #132f4f;
      border: 1px solid #5689b465;
      color: #f4faff;
      min-height: 130px;
      padding: 25px 26px;
      font-size: 37px;
      letter-spacing: -.8px;
      line-height: 1.15;
      font-weight: 630;
    }

    .step .label { position: relative; z-index: 1; }
    .step .active-fill {
      position: absolute;
      z-index: 0;
      inset: 0;
      background: linear-gradient(104deg, #1e5a8c, #15476f);
      transform-origin: left;
    }

    .step .number {
      display: block;
      margin-bottom: 12px;
      color: #c2e6ff;
      font-size: 28px;
      font-weight: 560;
      font-variant-numeric: tabular-nums;
    }

    .arches {
      position: absolute;
      top: 1400px;
      left: -145px;
      display: flex;
      gap: 30px;
      transform: rotate(-8deg);
      opacity: .77;
      pointer-events: none;
    }
    .arches i {
      display: block;
      width: 475px;
      height: 820px;
      border: 2px solid #8bbde03d;
      border-bottom: none;
      border-radius: 245px 245px 0 0;
      box-shadow: inset 18px 5px 40px #669cc509, 16px -5px 80px #578dc810;
      background: linear-gradient(125deg, #84aac60c, #0b264000 70%);
    }

    .swipe {
      position: absolute;
      z-index: 4;
      inset: 0;
      background: #071729;
      pointer-events: none;
      opacity: 0;
    }
  </style>
</head>
<body>
  <main id="editorial" data-composition-id="editorial" data-no-timeline
        data-start="0" data-duration="9" data-width="1080" data-height="1920" data-fps="30">
    <div class="window">
      <video id="campus" class="clip" data-start="0" data-duration="9" data-track-index="0"
             data-has-audio="false" src="assets/campus.mp4" muted playsinline></video>
      <div class="photo-shade"></div>
    </div>
    <div class="copy">
      <span class="topic">Rematrícula</span>
      <h1 class="headline" id="headline">O que falta<strong>para renovar?</strong></h1>
    </div>
    <div class="steps">
      <div class="step" id="pagamento">
        <div class="active-fill"></div>
        <div class="label"><span class="number">01</span>Pagamento</div>
      </div>
      <div class="step" id="contrato">
        <div class="active-fill"></div>
        <div class="label"><span class="number">02</span>Contrato</div>
      </div>
    </div>
    <div class="arches" aria-hidden="true"><i data-layout-allow-overflow></i><i data-layout-allow-overflow></i><i data-layout-allow-overflow></i></div>
    <div class="swipe"></div>
  </main>
  <script>
    const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
    const win = document.querySelector(".window");
    const topic = document.querySelector(".topic");
    const heading = document.getElementById("headline");
    const paymentStep = document.getElementById("pagamento");
    const contractStep = document.getElementById("contrato");
    const payment = paymentStep.querySelector(".active-fill");
    const contract = contractStep.querySelector(".active-fill");
    const swipe = document.querySelector(".swipe");
    const titles = [
      ["O que falta", "para renovar?"],
      ["Pague a mensalidade", "de janeiro."],
      ["Assine o contrato", "pelo aplicativo."]
    ];
    const strong = heading.querySelector("strong");

    function renderAt(time) {
      const beat = time < 2.5 ? 0 : time < 5.6 ? 1 : 2;
      const start = [0, 2.5, 5.6][beat];
      const settled = ease((time - start) / .39);
      const visualHold = beat === 0 ? 1 : settled;
      const drift = ease(time / 9);
      topic.textContent = beat === 2 ? "App Grupo Anchieta" : "Rematrícula";
      heading.firstChild.data = titles[beat][0];
      strong.textContent = titles[beat][1];
      heading.style.opacity = .18 + .82 * visualHold;
      heading.style.transform = `translateY(${18 * (1 - visualHold)}px)`;
      win.style.transform = `translateY(${-19 * drift}px) scale(${1 - .035 * drift})`;
      payment.style.transform = `scaleX(${beat === 1 ? settled : beat === 2 ? 1 : 0})`;
      contract.style.transform = `scaleX(${beat === 2 ? settled : 0})`;
      swipe.style.opacity = .38 * ease((time - 8.7) / .30);
    }

    window.addEventListener("hf-seek", (event) => renderAt(event.detail.time));
    renderAt(0);
  </script>
</body>
</html>
