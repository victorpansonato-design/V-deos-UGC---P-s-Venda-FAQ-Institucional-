<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Encerramento · Grupo Anchieta</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    main {
      width: 1080px;
      height: 1920px;
      display: grid;
      place-items: center;
      background: #f5faff;
    }

    #logo {
      width: 540px;
      height: 260px;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <main id="encerramento" data-composition-id="encerramento" data-no-timeline
        data-start="0" data-duration="1.4" data-width="1080" data-height="1920" data-fps="30">
    <img id="logo" src="assets/logo-local.svg" alt="Grupo Anchieta">
  </main>
  <script>
    const logo = document.getElementById("logo");
    function renderAt(time) {
      const progress = 1 - Math.pow(1 - Math.max(0, Math.min(1, time / 0.3)), 3);
      logo.style.opacity = 0.78 + 0.22 * progress;
      logo.style.transform = "translateY(" + (12 * (1 - progress)) + "px)";
    }

    window.addEventListener("hf-seek", (event) => renderAt(event.detail.time));
    renderAt(0);
  </script>
</body>
</html>
